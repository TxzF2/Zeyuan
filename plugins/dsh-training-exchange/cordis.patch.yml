# dsh-training-exchange bundle layer — applied when a profile lists this bundle
# (package.json declares `dsh.bundle.patch` pointing at this file).
#
# PITFALL: `name` is a PACKAGE NAME (resolved through the profile's node_modules
# or the installation fallback `$DSH_HOME/profiles/node_modules`), NOT a
# relative path. `dsh-training-exchange` is this package's main entry (→ dist/index.js).
- insert:
    - id: dsh-training-exchange
      name: dsh-training-exchange
